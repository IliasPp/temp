[run]
name = "food_only"
note = ""
created = "2026-10-27T13:32:37+00:00"
created_by = "l@l"

[spec]
specs = ["super", "super_disc", "super_disc_drog"]
land = ""

[spec.shop_types]
super = ["Supermarkt"]
super_disc = ["Supermarkt", "Discount Geschäft"]
super_disc_drog = ["Supermarkt", "Discount Geschäft", "Drogeriemarkt"]

[years]
mode = "range"
values = [2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]

[report]
metrics = ["hhi", "share"]
bases = ["umsatz", "vkfl", "pop", "area"]
scope = "food"
exclude_actors = []
levels = ["DE", "BL", "KREIS"]
actor_levels = ["Gruppe", "Chain"]
year_focus = 0

[output]
figures = ["map_hhi", "map_share", "map_leader", "heat_shares", "trend_hhi", "trend_shares", "dist_hhi", "scatter_basis", "bars_bl", "grid_maps", "map_catchments"]
formats = ["pdf", "png"]
export_csv = true
write_rasters = false

[solve]
stages = ["cube", "figures"]
force = []
osrm = "http://localhost:5000"
network = "germany-latest"
cache = ""
grid = "de_100m"
k = 20
cert_target = 0.9
iso_min = 20
max_workers = 8
cells_per_catchment = 0
